<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZeyWin SDK Fleet Install Flow</title>
  <desc id="desc">A diagram showing one SDK release configuring many Unity games.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40c9ff"/>
      <stop offset="1" stop-color="#47f59b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#07111f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f6f9fc"/>
  <text x="60" y="74" fill="#12233a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="850">Fleet-ready Unity setup</text>
  <text x="60" y="112" fill="#516579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Update the SDK once. Configure every game with its own keys and IDs.</text>
  <path d="M214 292 H990" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(64 202)">
      <rect width="250" height="170" rx="18" fill="#ffffff"/>
      <circle cx="52" cy="52" r="26" fill="#102b50"/>
      <text x="43" y="61" fill="#ffffff" font-size="25" font-weight="850">1</text>
      <text x="34" y="100" fill="#12233a" font-size="23" font-weight="800">Git package</text>
      <text x="34" y="132" fill="#657789" font-size="16">Install or update</text>
      <text x="34" y="154" fill="#657789" font-size="16">com.zeywin.ads</text>
    </g>
    <g transform="translate(374 202)">
      <rect width="250" height="170" rx="18" fill="#ffffff"/>
      <circle cx="52" cy="52" r="26" fill="#1e7b52"/>
      <text x="43" y="61" fill="#ffffff" font-size="25" font-weight="850">2</text>
      <text x="34" y="100" fill="#12233a" font-size="23" font-weight="800">Configurator</text>
      <text x="34" y="132" fill="#657789" font-size="16">Batchmode writes</text>
      <text x="34" y="154" fill="#657789" font-size="16">manifest + settings</text>
    </g>
    <g transform="translate(684 202)">
      <rect width="250" height="170" rx="18" fill="#ffffff"/>
      <circle cx="52" cy="52" r="26" fill="#3454d1"/>
      <text x="43" y="61" fill="#ffffff" font-size="25" font-weight="850">3</text>
      <text x="34" y="100" fill="#12233a" font-size="23" font-weight="800">Per-game keys</text>
      <text x="34" y="132" fill="#657789" font-size="16">ZeyWin API key</text>
      <text x="34" y="154" fill="#657789" font-size="16">AdMob app + units</text>
    </g>
    <g transform="translate(994 202)">
      <rect width="142" height="170" rx="18" fill="#ffffff"/>
      <circle cx="52" cy="52" r="26" fill="#f4b942"/>
      <text x="43" y="61" fill="#12233a" font-size="25" font-weight="850">4</text>
      <text x="28" y="100" fill="#12233a" font-size="22" font-weight="800">Build</text>
      <text x="28" y="132" fill="#657789" font-size="16">APK/AAB</text>
      <text x="28" y="154" fill="#657789" font-size="16">ready</text>
    </g>
  </g>
  <g transform="translate(72 430)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="1056" height="96" rx="18" fill="#10243d"/>
    <text x="28" y="36" fill="#9fe7ff" font-size="16" font-weight="750">example</text>
    <text x="28" y="66" fill="#ffffff" font-size="18" font-family="SFMono-Regular,Consolas,monospace">Unity -batchmode -executeMethod ZeyWinAds.Editor.ZeyWinAdsProjectConfigurator.ApplyFromCommandLine -androidPackageId ... -zeywinApiKey ... -admobAndroidAppId ...</text>
  </g>
</svg>
